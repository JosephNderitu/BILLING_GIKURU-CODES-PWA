<div class="item-row grid grid-cols-6 md:grid-cols-12 gap-2 items-start rounded-xl border border-slate-200 p-3
            md:rounded-none md:border-0 md:border-t md:first:border-t-0 md:px-2 md:py-2">
  {% for h in f.hidden_fields %}{{ h }}{% endfor %}

  <div class="col-span-6 md:col-span-3">
    <label class="md:hidden block text-[11px] font-semibold text-slate-500 mb-1">Description</label>
    {{ f.description }}{{ f.description.errors }}
  </div>
  <div class="col-span-6 md:col-span-2">
    <label class="md:hidden block text-[11px] font-semibold text-slate-500 mb-1">Serial numbers</label>
    {{ f.serial_numbers }}
  </div>
  <div class="col-span-2 md:col-span-2">
    <label class="md:hidden block text-[11px] font-semibold text-slate-500 mb-1">Qty</label>
    {{ f.quantity }}{{ f.quantity.errors }}
  </div>
  <div class="col-span-4 md:col-span-2">
    <label class="md:hidden block text-[11px] font-semibold text-slate-500 mb-1">Unit price</label>
    {{ f.unit_price }}{{ f.unit_price.errors }}
  </div>
  <div class="col-span-5 md:col-span-2 flex items-center justify-between md:justify-end md:pt-2.5">
    <span class="md:hidden text-[11px] font-semibold text-slate-500">Line total</span>
    <span class="line-total font-semibold text-sm">0.00</span>
  </div>
  <div class="col-span-1 flex justify-end md:pt-0.5">
    <span class="hidden">{{ f.DELETE }}</span>
    <button type="button" aria-label="Remove item"
            class="remove-row h-9 w-9 grid place-items-center rounded-lg text-slate-400 hover:text-red-600 hover:bg-red-50">
      <i class="fa-solid fa-trash"></i></button>
  </div>
</div>
